<ng-template>
  <h2>Product List</h2>

  <ul>
  </ul>

  <h3>Add Product</h3>
  <form>
    <div>
      <label for="name">Product Name:</label>
      <input
        id="name"
        name="newProductName"
        type="text"
      />
    </div>
    <div>
      <label for="price">Product Price:</label>
      <input
        id="price"
        name="newProductPrice"
        type="number"
      />
    </div>
    <button type="button"></button>
  </form>
</ng-template>
