<div class="product-list">
    <ng-container *ngIf="products.length; else noProducts">
      <ul>
        <li *ngFor="let product of products">
          {{ product.name }}
          <button (click)="toggleDescription(product)">Показать описание</button>
          <p *ngIf="product.showDescription">{{ product.description }}</p>
        </li>
      </ul>
    </ng-container>
    <ng-template #noProducts>
      <p>Нет доступных продуктов</p>
    </ng-template>
</div>
