<section class="access-card">
  <p class="access-card__eyebrow">Workspace Access</p>
  <h2 data-testid="access-title">Unlock the mock workspace</h2>
  <p class="access-card__text">
    This capstone uses a mock repository instead of a real backend, but the app still behaves like a gated workspace.
    Unlocking it enables the guarded routes and lets you manage tasks end-to-end on the frontend.
  </p>
  <button type="button" data-testid="unlock-workspace-btn" (click)="unlockWorkspace()">
    Enter Tasks Workspace
  </button>
</section>
