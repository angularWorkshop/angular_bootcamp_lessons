<main class="progress-shell">
  <p class="progress-shell__eyebrow">Change Detection Exercise</p>
  <h1 class="progress-shell__title">{{ title }}</h1>

  <section class="progress-shell__intro">
    <p class="progress-shell__text">
      Здесь важно не просто обновить число. Нужно перевести child component на <code>OnPush</code> и перестать менять
      текущий объект прогресса напрямую.
    </p>
  </section>

  <app-progress-card [progress]="progress"></app-progress-card>

  <section class="progress-shell__actions">
    <button type="button" data-testid="complete-lesson" (click)="completeLesson()">Complete lesson</button>
    <button type="button" data-testid="reset-progress" (click)="resetProgress()">Reset progress</button>
  </section>

  <section class="progress-shell__summary">
    <p class="progress-shell__summary-line" data-testid="onpush-note">
      The child component should use OnPush.
    </p>
    <p class="progress-shell__summary-line" data-testid="immutability-note">
      Parent updates should create a new object reference.
    </p>
  </section>
</main>
