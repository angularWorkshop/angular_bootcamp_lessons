<main class="list-shell">
  <p class="list-shell__eyebrow">Dynamic List Exercise</p>
  <h1 class="list-shell__title">Todo List</h1>

  <div class="add-form">
    <input
      class="add-form__input"
      data-testid="new-todo-input"
      type="text"
      placeholder="New task..."
      [(ngModel)]="newTodoText"
    />
    <button
      class="btn"
      data-testid="add-btn"
      type="button"
      (click)="addTodo()"
    >
      Add
    </button>
  </div>

  <ul class="todo-list" data-testid="todo-list">
    @for (todo of todos; track todo.id) {
      <li class="todo-item" data-testid="todo-item">
        <span class="todo-item__text" data-testid="todo-text">{{ todo.text }}</span>
        <button
          class="todo-item__remove"
          data-testid="remove-btn"
          type="button"
          (click)="removeTodo(todo.id)"
        >
          Remove
        </button>
      </li>
    } @empty {
      <li class="empty-message" data-testid="empty-message">No todos yet</li>
    }
  </ul>
</main>
