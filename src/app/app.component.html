<div class="directory" data-testid="directory">
  <h1 class="directory__title" data-testid="title">User Directory</h1>

  <p data-testid="total-count">Total: {{ totalCount() }} users</p>
  <p data-testid="admin-count">Admins: {{ adminCount() }}</p>

  @for (user of users(); track user.id) {
    <div class="user-card" [attr.data-testid]="'user-' + user.id">
      <span data-testid="user-name">{{ user.name }}</span>
      <span data-testid="user-email">{{ user.email }}</span>
    </div>
  }
</div>
