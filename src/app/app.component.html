<main class="checklist-shell">
  <p class="checklist-shell__eyebrow">Immutable Update Exercise</p>
  <h1 class="checklist-shell__title">{{ title }}</h1>

  <section class="checklist-shell__intro">
    <p class="checklist-shell__text">
      Здесь child component уже живёт на <code>OnPush</code>. Значит, если мутировать старый массив или старый lesson
      object, список начнёт обновляться ненадёжно.
    </p>
  </section>

  <app-lesson-checklist [lessons]="lessons"></app-lesson-checklist>

  <section class="checklist-shell__actions">
    <button type="button" data-testid="complete-first-lesson" (click)="completeFirstLesson()">
      Complete first lesson
    </button>
    <button type="button" data-testid="reset-checklist" (click)="resetChecklist()">Reset checklist</button>
  </section>

  <section class="checklist-shell__summary">
    <p class="checklist-shell__summary-line" data-testid="immutability-note">
      Checklist updates should create new references.
    </p>
    <p class="checklist-shell__summary-line" data-testid="onpush-note">
      The OnPush child should react to those new references.
    </p>
  </section>
</main>
