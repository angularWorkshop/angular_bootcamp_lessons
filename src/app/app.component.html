<main class="sync-card">
  <p class="sync-card__eyebrow">Effect Exercise</p>
  <h1 class="sync-card__title">{{ title }}</h1>

  <section class="sync-card__panel">
    <div class="sync-card__row">
      <div>
        <p class="sync-card__label">Theme</p>
        <p class="sync-card__value" data-testid="theme-label">{{ currentTitleLabel() }}</p>
      </div>

      <button type="button" data-testid="toggle-theme" (click)="toggleTheme()">Toggle theme</button>
    </div>
  </section>

  <section class="sync-card__panel">
    <div class="sync-card__row">
      <div>
        <p class="sync-card__label">Density</p>
        <p class="sync-card__value" data-testid="compact-mode-label">{{ compactModeLabel() }}</p>
      </div>

      <button type="button" data-testid="toggle-compact-mode" (click)="toggleCompactMode()">
        Toggle compact mode
      </button>
    </div>
  </section>

  <section class="sync-card__summary">
    <p class="sync-card__summary-line" data-testid="document-title-note">
      document.title should reflect the current preferences
    </p>
    <p class="sync-card__summary-line" data-testid="local-storage-note">
      localStorage should store the latest snapshot
    </p>
  </section>
</main>
