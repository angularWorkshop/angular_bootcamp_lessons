<div class="search" data-testid="search">
  <h1 data-testid="title">Live Search</h1>

  <input
    data-testid="search-input"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    placeholder="Search frameworks..."
  />

  <p data-testid="search-term">Search: {{ searchTerm() }}</p>
  <p data-testid="result-count">Results: {{ resultCount() }}</p>

  @for (item of results(); track item.id) {
    <div class="result-item" [attr.data-testid]="'result-' + item.id">
      <span data-testid="result-name">{{ item.name }}</span>
    </div>
  }
</div>
