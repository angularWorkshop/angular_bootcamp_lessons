<section class="page">
  <h1 data-testid="title">Lifecycle Resource Monitor</h1>

  <p class="meta" data-testid="lesson-count">Lessons loaded: {{ lessons().length }}</p>
  <ul class="list">
    @for (lesson of lessons(); track lesson) {
      <li class="list__item" [attr.data-testid]="'lesson-' + lesson">{{ lesson }}</li>
    }
  </ul>

  <p class="meta" data-testid="heartbeat">Heartbeat: {{ heartbeat() }}</p>
  <p class="hint">TODO: migrate interval cleanup to takeUntilDestroyed().</p>
</section>
