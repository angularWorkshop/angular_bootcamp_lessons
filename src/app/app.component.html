<main class="list-shell">
  <p class="list-shell__eyebrow">Track &amp; Empty Exercise</p>
  <h1 class="list-shell__title">Task List</h1>

  <div class="list-shell__actions">
    <button class="btn" data-testid="refresh-btn" type="button" (click)="refresh()">Refresh</button>
    <button class="btn btn--secondary" data-testid="clear-btn" type="button" (click)="clearAll()">Clear All</button>
  </div>

  <ol class="task-list" data-testid="task-list">
    @for (task of tasks; track task.id; let i = $index) {
      <li class="task-item" data-testid="task-item">
        <span class="task-item__index" data-testid="task-index">{{ i + 1 }}</span>
        <span class="task-item__title" data-testid="task-title">{{ task.title }}</span>
      </li>
    } @empty {
      <li class="empty-message" data-testid="empty-message">No tasks</li>
    }
  </ol>
</main>
