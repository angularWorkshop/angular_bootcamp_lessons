<main>
  <h1>File display lab</h1>
  <p>TODO: connect the raw values to fileSize and truncate pipes.</p>
  @for (file of files; track file.id) {
    <article [attr.data-testid]="'file-' + file.id">
      <h2>{{ file.name }}</h2>
      <p class="size" data-testid="file-size">{{ file.bytes }}</p>
      <p data-testid="file-description">{{ file.description }}</p>
    </article>
  }
</main>
