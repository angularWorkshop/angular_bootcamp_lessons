<main class="list-shell">
  <p class="list-shell__eyebrow">List Rendering Exercise</p>
  <h1 class="list-shell__title">Team Members</h1>

  <ul class="user-list" data-testid="user-list">
    @for (user of users; track user.id) {
      <li class="user-card" data-testid="user-card">
        <p class="user-card__name" data-testid="user-name">{{ user.name }}</p>
        <p class="user-card__role" data-testid="user-role">{{ user.role }}</p>
      </li>
    }
  </ul>
</main>
