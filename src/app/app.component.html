<main class="app-shell">
  <h1 class="app-shell__title">{{ title }}</h1>

  <div class="app-shell__layout">
    <nav class="app-shell__nav" data-testid="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" data-testid="nav-dashboard">Dashboard</a>
      <a routerLink="/settings" routerLinkActive="active" data-testid="nav-settings">Settings</a>
      <a routerLink="/profile" routerLinkActive="active" data-testid="nav-profile">Profile</a>
    </nav>

    <section class="app-shell__content">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
