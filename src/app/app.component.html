<div class="catalog" data-testid="catalog">
  <h1 class="catalog__title" data-testid="title">Product Catalog</h1>

  <app-category-filter
    [categories]="categories"
    (selected)="onCategorySelected($event)"
    (cleared)="onFilterCleared()"
  />

  <p class="catalog__selected" data-testid="selected-category">
    {{ displayCategory() }}
  </p>

  <p class="catalog__counter" data-testid="change-count">
    Filter changes: {{ filterChangeCount() }}
  </p>
</div>
