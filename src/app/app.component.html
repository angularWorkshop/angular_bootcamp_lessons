<main class="shell">
  <header class="hero"><div><p class="hero__eyebrow">SECTION 18</p><h1 class="hero__title">Upload Retry Flow</h1><p class="hero__text">Handle validation, partial failure, retry, and cancel for each file separately.</p></div></header>
  <section class="drop-zone"><button type="button" data-testid="load-input-files" (click)="facade.loadInputFiles()">Load input files</button></section>
  <section class="panel">
    <p data-testid="rejected-list">{{ facade.rejected().join(', ') || 'none' }}</p>
    @for (file of facade.files(); track file.id) {
      <article class="card" [attr.data-testid]="'retry-file-' + file.id">
        <p>{{ file.name }}</p>
        <p [attr.data-testid]="'retry-status-' + file.id">{{ file.status }}</p>
        <p [attr.data-testid]="'retry-error-' + file.id">{{ file.error || 'none' }}</p>
        <div class="actions">
          <button type="button" class="secondary" [attr.data-testid]="'start-' + file.id" (click)="facade.startFile(file.id)">Start</button>
          <button type="button" class="secondary" [attr.data-testid]="'cancel-' + file.id" (click)="facade.cancelFile(file.id)">Cancel</button>
          <button type="button" [attr.data-testid]="'retry-' + file.id" (click)="facade.retryFile(file.id)">Retry</button>
        </div>
      </article>
      
    }
  </section>
</main>
