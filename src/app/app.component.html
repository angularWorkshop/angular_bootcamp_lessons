<main class="page">
  <section class="panel">
    <p class="eyebrow">Topic 24.1</p>
    <h1 data-testid="title">Product feed formatting board</h1>
    <p class="lede">
      Starter task: format names, prices, and release dates through Angular pipes.
    </p>
  </section>

  <section class="grid">
    <article class="card" *ngFor="let product of products; let index = index" [attr.data-testid]="'product-' + index">
      <h2 [attr.data-testid]="'name-' + index">
        {{ product.name | uppercase }}
      </h2>
      <p class="metric" [attr.data-testid]="'price-' + index">
        {{ product.price | currency: 'USD' : 'symbol' : '1.2-2' }}
      </p>
      <p class="metric" [attr.data-testid]="'date-' + index">
        {{ product.releasedAt | date: 'yyyy-MM-dd' }}
      </p>
      <p [attr.data-testid]="'description-' + index">
        {{ product.description }}
      </p>
    </article>
  </section>
</main>
