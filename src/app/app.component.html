<main class="page">
  <section class="hero">
    <p class="hero__eyebrow">{{ environmentLabel }}</p>
    <h1>{{ title }}</h1>
    <p class="hero__subtitle">{{ subtitle }}</p>
  </section>

  <section class="checklist" aria-label="Launch checklist">
    <article class="checklist__card" data-testid="launch-step-project">
      <h2>{{ projectStepTitle }}</h2>
      <p>{{ projectStepDescription }}</p>
    </article>

    <article class="checklist__card" data-testid="launch-step-serve">
      <h2>{{ serveStepTitle }}</h2>
      <p>{{ serveStepDescription }}</p>
    </article>

    <article class="checklist__card" data-testid="launch-step-verify">
      <h2>{{ verifyStepTitle }}</h2>
      <p>{{ verifyStepDescription }}</p>
    </article>
  </section>
</main>
