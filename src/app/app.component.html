<main>
  <h1>Permission-driven workspace</h1>
  <p>Change the local demo permissions and inspect which nodes exist in the DOM.</p>
  <nav aria-label="Demo permissions">
    <button (click)="auth.setPermissions(['viewer'])">Viewer</button>
    <button (click)="auth.setPermissions(['viewer', 'admin'])">Admin</button>
    <button (click)="auth.setPermissions(['viewer', 'editor'])">Editor</button>
    <button (click)="auth.setPermissions([])">No permissions</button>
  </nav>
  <section>
    <p *appHasPermission="'viewer'" data-testid="viewer-note">Read-only access</p>
    <button *appHasPermission="'admin'" data-testid="admin-action">Delete user</button>
    <article *appHasPermission="'editor'" data-testid="editor-panel">Content editor</article>
  </section>
  <p class="notice">This is an isolated UI exercise, not a replacement for server authorization.</p>
</main>
