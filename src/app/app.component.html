<main class="flow-page">
  <section class="flow-page__hero">
    <h1>{{ title }}</h1>
    <p>{{ summary }}</p>
  </section>

  <section class="stage-list" aria-label="Bootstrap flow">
    <article class="stage-card" data-testid="entry-stage-main">
      <span class="stage-card__index">01</span>
      <div>
        <h2>{{ entryStageTitle }}</h2>
        <p>{{ entryStageDetail }}</p>
      </div>
    </article>

    <article class="stage-card" data-testid="entry-stage-module">
      <span class="stage-card__index">02</span>
      <div>
        <h2>{{ moduleStageTitle }}</h2>
        <p>{{ moduleStageDetail }}</p>
      </div>
    </article>

    <article class="stage-card" data-testid="entry-stage-render">
      <span class="stage-card__index">03</span>
      <div>
        <h2>{{ renderStageTitle }}</h2>
        <p>{{ renderStageDetail }}</p>
      </div>
    </article>
  </section>
</main>
