<main>
  <h1>File display lab</h1>
  <p>Keep display transformations in standalone, pure pipes.</p>
  @for (file of files; track file.id) {
    <article [attr.data-testid]="'file-' + file.id">
      <h2>{{ file.name }}</h2>
      <p class="size" data-testid="file-size">{{ file.bytes | fileSize: precision }}</p>
      <p data-testid="file-description">{{ file.description | truncate: descriptionLimit }}</p>
    </article>
  }
</main>
