<article class="lesson-preview-card">
  <p class="lesson-preview-card__eyebrow">{{ lesson.format }}</p>
  <h2 class="lesson-preview-card__title">{{ lesson.title }}</h2>
  <div class="lesson-preview-card__meta">
    <span class="lesson-preview-card__pill">{{ lesson.duration }}</span>
    <span class="lesson-preview-card__pill">{{ lesson.level }}</span>
  </div>
  <p class="lesson-preview-card__summary">Use a typed input to move data from the parent into this standalone card.</p>
</article>
